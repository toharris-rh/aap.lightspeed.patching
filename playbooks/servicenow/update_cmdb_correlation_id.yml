---
# ============================================================================
# playbooks/servicenow/update_cmdb_correlation_id.yml
# ============================================================================
# Links the ServiceNow CMDB CI back to its Red Hat Insights record by stamping
# the Insights **inventory record UUID** into correlation_id (issue #94).
#
# Insights exposes two identifiers; this playbook captures both from one
# inventory API call (GET /inventory/v1/hosts?display_name=<fqdn>):
#   * inventory record `id`  — the canonical inventory UUID. It is what the
#     console URL and vulnerability API path use, AND what the native
#     Insights -> EDA event carries as context.inventory_id. -> correlation_id,
#     so an incoming event joins directly to this CI.
#   * `insights_id` (machine-id) — the client identity (= the Subscription
#     Manager ID on EC2). Preserved in comments for reference.
#
# The CI gets:
#   correlation_id = inventory UUID (bare, matches the event)
#   comments       = Insights deep-link + the machine-id
# (correlation_display is read-only via the Table API on this instance, so the
#  source name lives in the comments.)
#
# Consumed inputs (workflow artifacts / extra_vars):
#   cmdb_ci_sys_id   CI sys_id (artifact from register_cmdb_and_relate);
#                    falls back to a cmdb_ci_linux_server lookup by FQDN
#
# Credentials: Lightspeed Patching - ServiceNow  (SN_* env vars)
#              Lightspeed Patching - Insights    (INSIGHTS_CLIENT_ID/SECRET)
# Runs entirely on the control node — no SSH to the managed host.
# ============================================================================

- name: Stamp the Insights inventory UUID into the CMDB CI correlation_id
  hosts: all
  gather_facts: false

  vars:
    ci_resource: cmdb_ci_linux_server
    insights_base_url: "{{ lookup('ansible.builtin.env', 'INSIGHTS_BASE_URL') | default('https://console.redhat.com', true) }}"
    insights_client_id: "{{ lookup('ansible.builtin.env', 'INSIGHTS_CLIENT_ID') }}"
    insights_client_secret: "{{ lookup('ansible.builtin.env', 'INSIGHTS_CLIENT_SECRET') }}"

  tasks:
    - name: Resolve Insights IDs and patch the CMDB CI
      delegate_to: localhost
      block:
        - name: Obtain Insights bearer token
          ansible.builtin.uri:
            url: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ insights_client_id }}"
              client_secret: "{{ insights_client_secret }}"
            status_code: 200
          register: insights_token_resp
          no_log: true

        - name: Look up the Insights inventory record for this host
          ansible.builtin.uri:
            url: "{{ insights_base_url }}/api/inventory/v1/hosts?display_name={{ inventory_hostname }}"
            method: GET
            headers:
              Authorization: "Bearer {{ insights_token_resp.json.access_token }}"
            status_code: 200
          register: inventory_resp
          no_log: true

        - name: Fail if the host is not registered in Insights
          ansible.builtin.assert:
            that:
              - inventory_resp.json.total | int > 0
            fail_msg: >-
              {{ inventory_hostname }} not found in Insights inventory — register
              the host with Insights before stamping the correlation_id.

        - name: Capture the inventory UUID and machine-id
          ansible.builtin.set_fact:
            insights_inventory_id: "{{ inventory_resp.json.results[0].id }}"
            insights_machine_id: "{{ inventory_resp.json.results[0].insights_id | default('', true) }}"

        # ── Resolve CI sys_id ────────────────────────────────────────────────
        - name: Use the CI sys_id artifact when present
          ansible.builtin.set_fact:
            ci_sys_id: "{{ cmdb_ci_sys_id }}"
          when:
            - cmdb_ci_sys_id is defined
            - cmdb_ci_sys_id | string | length > 0

        - name: Resolve CI sys_id by FQDN (fallback)
          when: ci_sys_id is not defined
          block:
            - name: Look up CI by FQDN — {{ ci_resource }}
              servicenow.itsm.api_info:
                resource: "{{ ci_resource }}"
                sysparm_query: "fqdn={{ inventory_hostname }}^ORname={{ inventory_hostname }}"
              register: ci_lookup

            - name: Fail if no CMDB CI found for this host
              ansible.builtin.assert:
                that:
                  - ci_lookup.record | length > 0
                fail_msg: >-
                  No CI found in {{ ci_resource }} for '{{ inventory_hostname }}'.
                  Run the 'Register CMDB CI' job template first.

            - name: Set CI sys_id from the lookup
              ansible.builtin.set_fact:
                ci_sys_id: "{{ ci_lookup.record[0].sys_id }}"

        # ── Patch the CI ─────────────────────────────────────────────────────
        # NOTE: correlation_display is read-only via the Table API on this
        # instance (a PATCH returns 200 but the value never sticks), so the
        # source is named in the comments instead.
        - name: Stamp inventory UUID into correlation_id (+ comments)
          servicenow.itsm.api:
            action: patch
            resource: "{{ ci_resource }}"
            sys_id: "{{ ci_sys_id }}"
            data:
              correlation_id: "{{ insights_inventory_id }}"
              comments: |-
                Red Hat Insights inventory: {{ insights_base_url }}/insights/inventory/{{ insights_inventory_id }}
                Insights machine-id (Insights Client ID / Subscription Manager ID): {{ insights_machine_id }}

        - name: Summary
          ansible.builtin.debug:
            msg: >-
              CI {{ inventory_hostname }} ({{ ci_sys_id }}) correlation_id set to
              Insights inventory UUID {{ insights_inventory_id }}
              (machine-id {{ insights_machine_id }} kept in comments).
