---
# ============================================================================
# playbooks/servicenow/create_cve_incident.yml
# ============================================================================
# Opens a ServiceNow incident when a CVE with an automated remediation is
# detected on a managed host. Sets cmdb_ci at creation time and links the
# CI via task_ci (Affected CIs). Posts the Insights-authored remediation
# playbook YAML as a work note (audit artifact — matches the native
# Insights->ServiceNow pattern, e.g. CTASK0011747).
#
# Workflow artifacts consumed (from insights_fetch_remediation.yml):
#   has_automated_remediation   true when Insights has a playbook fix
#   reported_cve                CVE identifier (e.g. CVE-2026-45445)
#   cve_synopsis                short CVE title from Insights
#   cve_description             full CVE description
#   remediation_plan_name       Insights plan name
#   remediation_id              Insights plan UUID
#   remediation_playbook_content  the playbook YAML (text)
#   remediation_playbook_filename e.g. CVE-2026-45445.yml
#   insights_uuid               host's Insights inventory UUID
#
# Also threaded from provision/register flow:
#   cmdb_ci_sys_id              CI sys_id (skips FQDN lookup when present)
#   host_fqdn                   host FQDN (fallback CI lookup)
#
# Credential: Lightspeed Patching - ServiceNow  (SN_* env vars)
# ============================================================================

- name: Open a CVE incident and link to CMDB CI
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    incident_caller: service.ansible
    incident_impact: medium
    incident_urgency: medium
    incident_support_group: "Ansible Automation"
    ci_resource: cmdb_ci_linux_server

  tasks:

    # ── Guard ──────────────────────────────────────────────────────────────────
    - name: Skip when no automated remediation exists
      when: not (has_automated_remediation | default(false) | bool)
      block:
        - name: Log skip reason
          ansible.builtin.debug:
            msg: >-
              has_automated_remediation is false or undefined — skipping
              incident creation (Problem-ticket branch is a future phase).
        - name: End play early
          ansible.builtin.meta: end_play

    # ── Validate inputs ───────────────────────────────────────────────────────
    - name: Require reported_cve and either cmdb_ci_sys_id or host_fqdn
      ansible.builtin.assert:
        that:
          - reported_cve | default('') | length > 0
          - (cmdb_ci_sys_id | default('') | length > 0) or
            (host_fqdn | default('') | length > 0)
        fail_msg: >-
          Provide reported_cve= and either cmdb_ci_sys_id= or host_fqdn=
          as extra_vars.

    # ── Resolve CI sys_id ─────────────────────────────────────────────────────
    - name: Use pre-threaded CI sys_id when available
      when: cmdb_ci_sys_id | default('') | length > 0
      ansible.builtin.set_fact:
        ci_sys_id: "{{ cmdb_ci_sys_id }}"

    - name: Look up CI by FQDN (fallback)
      when: ci_sys_id is not defined
      block:
        - name: Query cmdb_ci_linux_server by FQDN
          servicenow.itsm.api_info:
            resource: "{{ ci_resource }}"
            sysparm_query: "fqdn={{ host_fqdn }}^ORname={{ host_fqdn }}"
          register: ci_lookup

        - name: Fail if no CMDB CI found
          ansible.builtin.assert:
            that:
              - ci_lookup.record | length > 0
            fail_msg: >-
              No CI found in {{ ci_resource }} for '{{ host_fqdn }}'.
              Run 'Register CMDB CI' first.

        - name: Store CI sys_id from lookup
          ansible.builtin.set_fact:
            ci_sys_id: "{{ ci_lookup.record[0].sys_id }}"

    # ── Create the Incident ───────────────────────────────────────────────────
    - name: Create the CVE incident
      servicenow.itsm.incident:
        state: new
        caller: "{{ incident_caller }}"
        short_description: >-
          CVE remediation — {{ reported_cve }}
        description: |-
          Automated CVE remediation triggered by Red Hat Insights.

          CVE:          {{ reported_cve }}
          Synopsis:     {{ cve_synopsis | default('n/a') }}
          Host:         {{ host_fqdn | default('n/a') }}
          Insights UUID: {{ insights_uuid | default('n/a') }}

          {{ cve_description | default('') }}

          Remediation plan: {{ remediation_plan_name | default('n/a') }}
          Plan ID:          {{ remediation_id | default('n/a') }}
        impact: "{{ incident_impact }}"
        urgency: "{{ incident_urgency }}"
        other:
          assignment_group: "{{ incident_support_group }}"
          cmdb_ci: "{{ ci_sys_id }}"
      register: incident_result

    - name: Store incident identifiers
      ansible.builtin.set_fact:
        cve_incident_number: "{{ incident_result.record.number }}"
        cve_incident_sys_id: "{{ incident_result.record.sys_id }}"

    - name: Show the incident number
      ansible.builtin.debug:
        msg: "Created {{ cve_incident_number }} for {{ reported_cve }}"

    # ── Bidirectional CI link (task_ci — Affected CIs) ────────────────────────
    - name: Link CI to incident via task_ci (Affected CIs)
      servicenow.itsm.api:
        action: post
        resource: task_ci
        data:
          task: "{{ cve_incident_sys_id }}"
          ci_item: "{{ ci_sys_id }}"

    # ── Post remediation playbook as a work note (audit artifact) ─────────────
    - name: Post remediation playbook to incident activity log
      when: remediation_playbook_content | default('') | length > 0
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_resource: incident
        snow_log_ticket_number: "{{ cve_incident_number }}"
        snow_log_ticket_sys_id: "{{ cve_incident_sys_id }}"
        snow_log_message: |-
          [Insights Remediation Playbook — {{ remediation_playbook_filename | default(reported_cve + '.yml') }}]
          {{ remediation_playbook_content }}

    # ── Summary work note ─────────────────────────────────────────────────────
    - name: Post summary work note
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_resource: incident
        snow_log_ticket_number: "{{ cve_incident_number }}"
        snow_log_ticket_sys_id: "{{ cve_incident_sys_id }}"
        snow_log_message: >-
          [Lightspeed Patching] CVE incident created automatically.
          CVE: {{ reported_cve }}.
          Host: {{ host_fqdn | default('n/a') }}.
          CMDB CI: {{ ci_sys_id }}.
          Insights UUID: {{ insights_uuid | default('n/a') }}.
          Remediation plan: {{ remediation_plan_name | default('n/a') }}
          ({{ remediation_id | default('n/a') }}).
          The Insights-authored remediation playbook is posted above.

    # ── Publish artifacts ─────────────────────────────────────────────────────
    - name: Publish incident artifacts for the downstream workflow
      ansible.builtin.set_stats:
        data:
          cve_incident_number: "{{ cve_incident_number }}"
          cve_incident_sys_id: "{{ cve_incident_sys_id }}"
