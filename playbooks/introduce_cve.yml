---
# ============================================================================
# playbooks/introduce_cve.yml — DEMO SETUP ONLY
# ============================================================================
# Downgrades a userspace package to a version with a known CVE so Red Hat
# Insights will detect the advisory, THEN drives the EDA event ourselves so the
# remediation workflow fires immediately (issue #91).
#
# WHY WE SELF-POST THE EVENT (issue #91):
#   Red Hat Insights *detects* the CVE on upload (visible in the console in
#   ~1 min), but it only *emits* the new-cve-* notification on a server-side
#   scheduled sweep (observed ~03:30 UTC, ~daily) that customers cannot trigger
#   on demand. Relying on it gives an up-to-24h, non-reproducible delay — and
#   inventory re-registration churn resets the per-system "new CVE" baseline, so
#   it may not fire at all. EDA itself reacts instantly; the latency is entirely
#   upstream. So we query the real detected CVE from the Insights vulnerability
#   API and POST a real-shaped notification straight to the event stream. The
#   native notification path stays valid as the "in production this is automatic"
#   talking point.
#
# After running this playbook:
#   1. the package is downgraded and insights-client uploads the new state
#   2. we poll the Insights vulnerability API until the CVE is detected
#   3. we POST a vulnerability notification (payload shape ==
#      rulebooks/insights_vulnerability_events.yml) to the event stream
#   → if "Forward events to rulebook activation" is ON, the
#     "Lightspeed Patching - Automated CVE Remediation" workflow launches
#
# The forward toggle is left MANUAL on purpose — staging a CVE should not
# auto-launch remediation every time.
#
# Inputs (via survey or extra_vars):
#   target_package   package name to downgrade (default: openssl)
#   target_version   epoch:version-release to pin (default: 1:3.5.5-2.el9_8)
#   reported_cve     override the detected CVE (default: top remediable CVE
#                    found via the Insights vulnerability API)
#   skip_eda_trigger set true to only downgrade (skip the self-POST)
#
# Credentials / env:
#   Lightspeed Patching - Linux Machine (SSH)  — the downgrade
#   Lightspeed Patching - Insights (service account)  — INSIGHTS_CLIENT_ID/SECRET
#   INSIGHTS_EDA_EVENT_STREAM_URL  — the event stream POST URL (from its Details
#                                    page; not secret, per-deployment)
#   INSIGHTS_EDA_TOKEN (or EDA_EVENT_STREAM_TOKEN)  — the X-Insight-Token value
# ============================================================================

- name: Introduce a known CVE for demo purposes (package downgrade)
  hosts: all
  gather_facts: false
  become: true

  vars:
    target_package: "openssl"
    target_version: "1:3.5.5-2.el9_8"

  tasks:
    - name: Downgrade to vulnerable version — {{ target_package }}
      ansible.builtin.dnf:
        name: "{{ target_package }}-{{ target_version }}"
        state: present
        allow_downgrade: true
      register: dnf_result

    - name: Confirm installed version
      ansible.builtin.command:
        cmd: "rpm -q {{ target_package }}"
      register: rpm_query
      changed_when: false

    - name: Show installed version
      ansible.builtin.debug:
        msg: "{{ rpm_query.stdout }} — CVE now present."

    - name: Update subscription-manager facts
      ansible.builtin.command:
        cmd: subscription-manager facts --update
      changed_when: false

    - name: Run insights-client
      ansible.builtin.command:
        cmd: insights-client
      changed_when: false
      failed_when: false

# ============================================================================
# Drive the EDA event ourselves (issue #91). Runs on the control node:
# query the host's real detected CVE, then POST a real-shaped Insights
# vulnerability notification to the event stream so the workflow can fire now.
# ============================================================================
- name: Trigger EDA with the detected CVE (self-POST the Insights notification)
  hosts: all
  gather_facts: false

  vars:
    skip_eda_trigger: false
    insights_base_url: "{{ lookup('ansible.builtin.env', 'INSIGHTS_BASE_URL') | default('https://console.redhat.com', true) }}"
    insights_client_id: "{{ lookup('ansible.builtin.env', 'INSIGHTS_CLIENT_ID') }}"
    insights_client_secret: "{{ lookup('ansible.builtin.env', 'INSIGHTS_CLIENT_SECRET') }}"
    eda_event_stream_url: "{{ lookup('ansible.builtin.env', 'INSIGHTS_EDA_EVENT_STREAM_URL') | default('', true) }}"
    eda_insights_token: >-
      {{ lookup('ansible.builtin.env', 'INSIGHTS_EDA_TOKEN')
         | default(lookup('ansible.builtin.env', 'EDA_EVENT_STREAM_TOKEN'), true) }}
    # The Insights vulnerability service detects the CVE a short time after the
    # upload — poll until it appears (default up to 5 min).
    cve_detect_retries: 30
    cve_detect_delay: 10

  tasks:
    - name: Self-POST the Insights vulnerability notification to EDA
      delegate_to: localhost
      when: not (skip_eda_trigger | bool)
      block:
        - name: Fail early if the event stream URL is not configured
          ansible.builtin.assert:
            that: eda_event_stream_url | length > 0
            fail_msg: >-
              INSIGHTS_EDA_EVENT_STREAM_URL is not set. Copy the POST URL from the
              event stream Details page (Automation Decisions → Event Streams →
              Lightspeed Patching - Insights Event Stream).

        - name: Obtain Insights bearer token
          ansible.builtin.uri:
            url: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ insights_client_id }}"
              client_secret: "{{ insights_client_secret }}"
            status_code: 200
          register: insights_token_resp
          no_log: true

        - name: Resolve the Insights inventory UUID for this host
          ansible.builtin.uri:
            url: "{{ insights_base_url }}/api/inventory/v1/hosts?display_name={{ inventory_hostname }}"
            method: GET
            headers:
              Authorization: "Bearer {{ insights_token_resp.json.access_token }}"
            status_code: 200
          register: inventory_resp
          no_log: true

        - name: Assert the host is registered in Insights
          ansible.builtin.assert:
            that: inventory_resp.json.total | int > 0
            fail_msg: "{{ inventory_hostname }} not found in Insights inventory — registration may not have completed."

        - name: Poll the vulnerability API until a remediable CVE is detected
          ansible.builtin.uri:
            url: "{{ insights_base_url }}/api/vulnerability/v1/systems/{{ inventory_resp.json.results[0].id }}/cves?remediation=2&sort=-cvss_score&limit=1"
            method: GET
            headers:
              Authorization: "Bearer {{ insights_token_resp.json.access_token }}"
            status_code: 200
          register: cve_resp
          until: cve_resp.json.meta.total_items | int > 0
          retries: "{{ cve_detect_retries | int }}"
          delay: "{{ cve_detect_delay | int }}"
          no_log: true

        - name: Select the detected CVE (allow override via reported_cve)
          ansible.builtin.set_fact:
            detected_cve: "{{ reported_cve | default(cve_resp.json.data[0].id, true) }}"
            # The Insights vulnerability API exposes the score as cvss3_score
            # (string, e.g. "9.100"), with cvss2_score as the legacy fallback.
            detected_cvss: >-
              {{ (cve_resp.json.data[0].attributes.cvss3_score
                  | default(cve_resp.json.data[0].attributes.cvss2_score, true)
                  | default(0.0, true)) | float }}

        - name: POST the vulnerability notification to the EDA event stream
          ansible.builtin.uri:
            url: "{{ eda_event_stream_url }}"
            method: POST
            headers:
              X-Insight-Token: "{{ eda_insights_token }}"
            body_format: json
            body:
              bundle: rhel
              application: vulnerability
              event_type: new-cve-cvss
              timestamp: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime }}"
              context:
                display_name: "{{ inventory_hostname }}"
                inventory_id: "{{ inventory_resp.json.results[0].id }}"
              events:
                - metadata: {}
                  payload:
                    reported_cve: "{{ detected_cve }}"
                    cvss_score: "{{ detected_cvss }}"
                    known_exploit: false
              source:
                application:
                  display_name: Vulnerability
                bundle:
                  display_name: Red Hat Enterprise Linux
            status_code: 200
          register: eda_post
          no_log: true

        - name: Report the triggered CVE
          ansible.builtin.debug:
            msg: >-
              Posted vulnerability notification for {{ detected_cve }}
              (CVSS {{ detected_cvss }}) on {{ inventory_hostname }} to the EDA
              event stream (HTTP {{ eda_post.status }}). If "Forward events to
              rulebook activation" is ON, the remediation workflow is now running.
