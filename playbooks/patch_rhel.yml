---
# ============================================================================
# playbooks/patch_rhel.yml
# ============================================================================
# Fully patches a RHEL host using dnf. Runs on initial onboarding (all
# packages) and can also be called for targeted advisory remediation.
#
# Uses snow_log to post per-host real-time work notes to the ServiceNow INC.
#
# Credentials: Lightspeed Patching - Linux Machine (SSH)
#              Lightspeed Patching - ServiceNow (for snow_log)
#              Lightspeed Patching - Satellite (SATELLITE_URL/USERNAME/PASSWORD
#                for CV version check and lifecycle env promotion)
# ============================================================================

- name: Patch RHEL host
  hosts: all
  gather_facts: true
  become: true

  vars:
    advisory_id: "{{ reported_cve | default('') }}"
    # EDA CVE path passes incident_number/incident_sys_id; CHG path passes
    # ticket_number/ticket_sys_id. Default both so snow_log fires on either.
    ticket_number: "{{ incident_number | default('') }}"
    ticket_sys_id: "{{ incident_sys_id | default('') }}"
    satellite_url: "{{ lookup('ansible.builtin.env', 'SATELLITE_URL') }}"
    satellite_username: "{{ lookup('ansible.builtin.env', 'SATELLITE_USERNAME') | default('admin', true) }}"
    satellite_password: "{{ lookup('ansible.builtin.env', 'SATELLITE_PASSWORD') }}"

  tasks:
    - name: Log patch start to ServiceNow
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_resource: incident
        snow_log_ticket_number: "{{ ticket_number | default('') }}"
        snow_log_ticket_sys_id: "{{ ticket_sys_id | default('') }}"
        snow_log_message: >-
          {{ inventory_hostname }}: Starting patch run
          {{ '(advisory: ' ~ advisory_id ~ ')' if advisory_id else '(full system update)' }}.
          Kernel before: {{ ansible_kernel }}.
      when: ticket_number is defined and ticket_number | length > 0

    - name: Apply all available updates
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true
      register: dnf_result
      when: advisory_id | length == 0

    # ── Satellite-aware CVE patching ──────────────────────────────────────────
    # 1. Check if dnf can already see the fix in the current repos.
    # 2. If not (rc 0 = nothing to update): look up the host's content view
    #    and lifecycle env in Satellite, verify the latest CV version has the
    #    errata, promote that version to the host's LCE, then re-confirm.
    # 3. Apply the fix once confirmed available (rc 100 = update available).
    - name: Check if CVE fix is available in current repos
      ansible.builtin.shell:
        cmd: "{{ ansible_facts['pkg_mgr'] }} check-update -q --cve {{ advisory_id }}"
      register: cve_check
      failed_when: false
      changed_when: false
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')

    # --- Satellite content check + promote (only when fix is not yet visible) --

    - name: Log — CVE fix not in current repos, checking Satellite content view
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_resource: incident
        snow_log_ticket_number: "{{ ticket_number }}"
        snow_log_ticket_sys_id: "{{ ticket_sys_id }}"
        snow_log_message: >-
          {{ inventory_hostname }}: Fix for {{ advisory_id }} is not available
          in the current Satellite repos. Checking Satellite content view to
          locate the errata and promote content to this host's lifecycle
          environment.
      when:
        - ticket_number | length > 0
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - cve_check.rc != 100

    - name: Look up Satellite host record to get content view and lifecycle env
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/hosts?search=name={{ inventory_hostname }}"
        user: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
      become: false
      delegate_to: localhost
      register: sat_host_info
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - cve_check.rc != 100

    - name: Set content view and lifecycle env facts from Satellite host record
      ansible.builtin.set_fact:
        _sat_cv_id: "{{ (sat_host_info.json.results | first).content_facet_attributes.content_view.id }}"
        _sat_cv_name: "{{ (sat_host_info.json.results | first).content_facet_attributes.content_view.name }}"
        _sat_lce_id: "{{ (sat_host_info.json.results | first).content_facet_attributes.lifecycle_environment.id }}"
        _sat_lce_name: "{{ (sat_host_info.json.results | first).content_facet_attributes.lifecycle_environment.name }}"
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - cve_check.rc != 100
        - sat_host_info is defined

    - name: Get latest content view version from Satellite
      ansible.builtin.uri:
        url: "{{ satellite_url }}/katello/api/content_view_versions?content_view_id={{ _sat_cv_id }}&per_page=1&order=version+DESC"
        user: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
      become: false
      delegate_to: localhost
      register: sat_cv_versions
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - cve_check.rc != 100
        - _sat_cv_id is defined

    - name: Set latest CV version facts
      ansible.builtin.set_fact:
        _sat_cv_version_id: "{{ (sat_cv_versions.json.results | first).id }}"
        _sat_cv_version: "{{ (sat_cv_versions.json.results | first).version }}"
        _sat_cv_version_lce_ids: "{{ (sat_cv_versions.json.results | first).environments | map(attribute='id') | map('string') | list }}"
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - cve_check.rc != 100
        - sat_cv_versions is defined

    - name: Check if latest CV version contains the CVE errata
      ansible.builtin.uri:
        url: "{{ satellite_url }}/katello/api/errata?content_view_version_id={{ _sat_cv_version_id }}&search=cve={{ advisory_id }}&per_page=1"
        user: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
      become: false
      delegate_to: localhost
      register: sat_errata_check
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - cve_check.rc != 100
        - _sat_cv_version_id is defined

    - name: Log — errata found in latest content view version
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_resource: incident
        snow_log_ticket_number: "{{ ticket_number }}"
        snow_log_ticket_sys_id: "{{ ticket_sys_id }}"
        snow_log_message: >-
          {{ inventory_hostname }}: Errata for {{ advisory_id }} confirmed in
          Satellite content view {{ _sat_cv_name }} version {{ _sat_cv_version }}.
          Promoting version {{ _sat_cv_version }} to {{ _sat_lce_name }} lifecycle
          environment.
      when:
        - ticket_number | length > 0
        - _sat_cv_version is defined
        - sat_errata_check is defined
        - sat_errata_check.json.total | int > 0

    - name: Fail if errata for CVE is not in the latest content view version
      ansible.builtin.fail:
        msg: >-
          {{ advisory_id }} errata is not present in {{ _sat_cv_name }}
          version {{ _sat_cv_version }}. A repo sync and CV publish is needed
          before this CVE can be remediated.
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - cve_check.rc != 100
        - sat_errata_check is defined
        - sat_errata_check.json.total == 0

    - name: Promote latest CV version to host's lifecycle environment
      ansible.builtin.uri:
        url: "{{ satellite_url }}/katello/api/content_view_versions/{{ _sat_cv_version_id }}/promote"
        method: POST
        user: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          environment_ids:
            - "{{ _sat_lce_id | int }}"
          force: false
        status_code: [200, 202]
      become: false
      delegate_to: localhost
      register: sat_promote_task
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - cve_check.rc != 100
        - _sat_cv_version_id is defined
        - _sat_lce_id | string not in _sat_cv_version_lce_ids
        - sat_errata_check.json.total > 0

    - name: Wait for Satellite CV promotion to complete
      ansible.builtin.uri:
        url: "{{ satellite_url }}/foreman_tasks/api/tasks/{{ sat_promote_task.json.id }}"
        user: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
      become: false
      delegate_to: localhost
      register: sat_task_status
      until: sat_task_status.json.state == 'stopped'
      retries: 30
      delay: 10
      when:
        - sat_promote_task is defined
        - sat_promote_task.json is defined
        - sat_promote_task.json.id is defined

    - name: Log — Satellite content view promotion complete
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_resource: incident
        snow_log_ticket_number: "{{ ticket_number }}"
        snow_log_ticket_sys_id: "{{ ticket_sys_id }}"
        snow_log_message: >-
          {{ inventory_hostname }}: Satellite promotion complete —
          {{ _sat_cv_name }} version {{ _sat_cv_version }} is now active in
          {{ _sat_lce_name }}. Validating that {{ advisory_id }} fix is now
          visible to this host.
      when:
        - ticket_number | length > 0
        - sat_task_status is defined
        - sat_task_status.json.result == 'success'

    - name: Fail if Satellite CV promotion did not succeed
      ansible.builtin.fail:
        msg: "Satellite CV promotion task {{ sat_promote_task.json.id }} ended with result: {{ sat_task_status.json.result }}"
      when:
        - sat_task_status is defined
        - sat_task_status.json is defined
        - sat_task_status.json.result is defined
        - sat_task_status.json.result != 'success'

    - name: Re-check if CVE fix is now available after content promotion
      ansible.builtin.shell:
        cmd: "{{ ansible_facts['pkg_mgr'] }} check-update -q --cve {{ advisory_id }}"
      register: cve_recheck
      failed_when: cve_recheck.rc != 0 and cve_recheck.rc != 100
      changed_when: false
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - cve_check.rc != 100

    - name: Fail if CVE fix is still not available after Satellite promotion
      ansible.builtin.fail:
        msg: >-
          {{ advisory_id }} fix is still not available after promoting
          {{ _sat_cv_name }} version {{ _sat_cv_version }} to {{ _sat_lce_name }}.
          Check Satellite repo sync status and host subscription assignment.
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - cve_check.rc != 100
        - cve_recheck is defined
        - cve_recheck.rc != 100

    - name: Log — CVE fix confirmed available, applying patch
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_resource: incident
        snow_log_ticket_number: "{{ ticket_number }}"
        snow_log_ticket_sys_id: "{{ ticket_sys_id }}"
        snow_log_message: >-
          {{ inventory_hostname }}: Fix for {{ advisory_id }} is now visible in
          repos. Applying patch via dnf upgrade --cve {{ advisory_id }}.
      when:
        - ticket_number | length > 0
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - cve_recheck is defined
        - cve_recheck.rc == 100

    # --- Apply fix once confirmed available ------------------------------------

    - name: Set CVE fix availability fact
      ansible.builtin.set_fact:
        _cve_fix_available: >-
          {{ cve_check.rc == 100 or
             (cve_recheck is defined and cve_recheck.rc is defined and cve_recheck.rc == 100) }}
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')

    - name: Apply CVE fix via Lightspeed remediation pattern
      ansible.builtin.shell:
        cmd: "{{ ansible_facts['pkg_mgr'] }} upgrade -v -y --cve {{ advisory_id }}"
      register: dnf_result
      changed_when: true
      when:
        - advisory_id | length > 0
        - advisory_id.startswith('CVE-')
        - _cve_fix_available | bool

    - name: Apply specific advisory or package
      ansible.builtin.dnf:
        name: "{{ advisory_id }}"
        state: latest
      register: dnf_result
      when:
        - advisory_id | length > 0
        - not advisory_id.startswith('CVE-')

    - name: Log patch result to ServiceNow
      ansible.builtin.include_role:
        name: snow_log
      vars:
        snow_log_resource: incident
        snow_log_ticket_number: "{{ ticket_number | default('') }}"
        snow_log_ticket_sys_id: "{{ ticket_sys_id | default('') }}"
        snow_log_message: >-
          {{ inventory_hostname }}: Patch complete.
          {{ dnf_result.results | length if dnf_result.results is defined else 0 }} packages updated.
          Reboot required: {{ dnf_result.changed | bool }}.
      when: ticket_number is defined and ticket_number | length > 0

    - name: Reboot if kernel or critical packages updated
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: dnf_result.changed

    # Re-upload to Red Hat Insights so its vulnerability view reflects the
    # PATCHED package state. register_rhel.yml uploads the pre-patch snapshot at
    # registration; without this refresh Insights keeps reporting CVEs that the
    # dnf update already fixed, leaving a misleadingly vulnerable baseline (and
    # drowning a deliberately-introduced demo CVE in stale noise). Best-effort:
    # a refresh hiccup must not fail onboarding (the host is already registered).
    # Insights re-runs the vulnerability analysis server-side a few minutes after
    # this upload.
    - name: Refresh Red Hat Insights so it re-scans the patched state
      ansible.builtin.command:
        cmd: insights-client
      register: insights_refresh
      changed_when: false
      failed_when: false

    - name: Publish patched hosts as workflow artifact
      ansible.builtin.set_stats:
        data:
          patched_hosts: "{{ inventory_hostname }}"
