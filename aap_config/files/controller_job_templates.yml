---
# NOTE: the infra.aap_configuration role uses `controller_templates` (not
# `controller_job_templates`) — a known collection quirk.
controller_templates:

  # ── Provision ──────────────────────────────────────────────────────────────
  - name: "{{ jt_provision }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/provision_vm_aws.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_aws }}"
      - "{{ cred_controller }}"
    extra_vars:
      aws_region: "{{ aws_default_region }}"
      aws_tf_state_bucket: "{{ aws_tf_state_bucket }}"
      linux_ssh_public_key: "{{ linux_ssh_public_key }}"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Pick a VM size"
      spec:
        - question_name: VM size
          question_description: "RHEL server t-shirt size on AWS"
          variable: vm_size_tier
          type: multiplechoice
          required: true
          default: medium
          choices:
            - small
            - medium
            - large

  # ── Unregister RHEL (CDN + Insights) ────────────────────────────────────
  # Best-effort: if the host is already gone, the play succeeds cleanly.
  # Runs against the live inventory (hosts: all). Wired as the first step
  # in the Teardown workflow (always → Teardown VM).
  - name: "{{ jt_unregister_rhel }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/unregister_rhel.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_linux }}"
      - "{{ cred_rh_cdn }}"

  # ── Teardown VM (AWS) ────────────────────────────────────────────────────
  # Terraform destroy + deregister host from AAP inventory. Runs against
  # the control inventory (no host lock). CDN/Insights unregistration is
  # handled by the Unregister RHEL JT in the Teardown workflow.
  # Idempotent (no VM / no state -> no-op).
  - name: "{{ jt_teardown }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/teardown_vm_aws.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_aws }}"            # AWS_* for terraform destroy
      - "{{ cred_controller }}"     # mint a token for inventory deregistration
    extra_vars:
      aws_region: "{{ aws_default_region }}"
      aws_tf_state_bucket: "{{ aws_tf_state_bucket }}"
      linux_ssh_public_key: "{{ linux_ssh_public_key }}"

  # ── Configure MOTD ─────────────────────────────────────────────────────────
  - name: "{{ jt_configure_motd }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/configure_motd.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_linux }}"
    ask_limit_on_launch: true

  # ── Register RHEL ──────────────────────────────────────────────────────────
  - name: "{{ jt_register_rhel }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/register_rhel.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_linux }}"
      - "{{ cred_rh_cdn }}"
    ask_limit_on_launch: true

  # ── Register CMDB CI + relate to Business Application ─────────────────────
  - name: "{{ jt_register_cmdb }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/register_cmdb_and_relate.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
    ask_variables_on_launch: true
    extra_vars:
      cmdb_business_app: "{{ cmdb_business_app }}"
      cmdb_managed_by: "{{ cmdb_managed_by }}"

  # ── Stamp Insights UUID into CMDB correlation_id ─────────────────────────
  # Runs after Register RHEL (Insights registration). Reads the Insights UUID
  # from /etc/insights-client/machine-id on the host (SSH), then PATCHes
  # correlation_id on the CMDB CI via ServiceNow.
  - name: "{{ jt_snow_correlation_id }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/update_cmdb_correlation_id.yml
    execution_environment: "{{ my_execution_environment }}"
    # Insights API (cred_insights_api) supplies the inventory UUID + machine-id;
    # runs on the control node, so no Linux Machine credential is needed (#94).
    credentials:
      - "{{ cred_insights_api }}"
      - "{{ cred_servicenow }}"
    ask_variables_on_launch: true

  # ── Patch RHEL (full) ──────────────────────────────────────────────────────
  - name: "{{ jt_patch_rhel }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/patch_rhel.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_linux }}"
      - "{{ cred_servicenow }}"
    ask_limit_on_launch: true
    ask_variables_on_launch: true

  # ── CVE Remediation ────────────────────────────────────────────────────────
  - name: "{{ jt_remediate_cve }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/remediate_cve.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_linux }}"
      - "{{ cred_servicenow }}"
    ask_limit_on_launch: true

  # ── Demo Setup: Introduce CVE ──────────────────────────────────────────────
  # Downgrades a package (cred_linux), then self-POSTs the detected CVE to the
  # EDA event stream so the workflow fires immediately (issue #91).
  # cred_insights_api injects INSIGHTS_CLIENT_ID/SECRET for the inventory +
  # vulnerability lookups; pass INSIGHTS_EDA_EVENT_STREAM_URL + the X-Insight-Token
  # (INSIGHTS_EDA_TOKEN) via extra_vars so the self-POST can reach the stream.
  - name: "{{ jt_introduce_cve }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/introduce_cve.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_linux }}"
      - "{{ cred_insights_api }}"
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    survey_enabled: false

  # ── Create the Insights remediation plan (Phase 11 / Slice 2) ──────────────
  # Runs on the control node. cred_insights_api injects INSIGHTS_CLIENT_ID/SECRET
  # as env vars. affected_host + reported_cve arrive as workflow extra_vars
  # (from the Insights -> EDA event) or on launch.
  - name: "{{ jt_insights_fetch_remediation }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/insights_fetch_remediation.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_insights_api }}"
    ask_variables_on_launch: true

  # ── ServiceNow callbacks (Provision workflow — RITM) ────────────────────────
  - name: "{{ jt_snow_notice_provision }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/notice_provision_started.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
      - "{{ cred_controller }}"

  - name: "{{ jt_snow_update_ritm_success }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/update_ritm.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
    extra_vars:
      ritm_outcome: success

  - name: "{{ jt_snow_update_ritm_failure }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/update_ritm.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
    extra_vars:
      ritm_outcome: failure

  # ── ServiceNow callbacks (Remediate workflow — Incident) ───────────────────
  - name: "{{ jt_snow_notice_started }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/notice_patch_started.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
      - "{{ cred_controller }}"

  - name: "{{ jt_snow_update_inc }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/update_incident.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
    extra_vars:
      inc_outcome: in_progress

  - name: "{{ jt_snow_close_inc }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/update_incident.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
    extra_vars:
      inc_outcome: success

  - name: "{{ jt_snow_create_inc }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/create_incident.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"

  # ── CMDB CI → Incident (Insights-scoped to provisioned host) ─────────────
  - name: "{{ jt_snow_relate_cmdb }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/relate_cmdb_to_incident.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
      - "{{ cred_insights_api }}"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Link a provisioned host's CMDB CI to a ServiceNow incident"
      spec:
        - question_name: Incident Number
          question_description: "ServiceNow incident to update (e.g. INC0011410)"
          variable: incident_number
          type: text
          required: true
          default: ""
        - question_name: Host FQDN
          question_description: "FQDN of the provisioned host to scope patching to"
          variable: host_fqdn
          type: text
          required: true
          default: ""
        - question_name: CVE ID
          question_description: "CVE being addressed (informational, added to work note)"
          variable: cve_id
          type: text
          required: false
          default: ""

  # ── Send CVE payload to ServiceNow (bypasses one-per-account dedup) ─────────
  - name: "{{ jt_send_cve_to_snow }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/send_cve_to_snow.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
      - "{{ cred_insights_api }}"
      - "{{ cred_rh_insights_integration }}"
      - "{{ cred_controller }}"
    survey_enabled: true
    survey_spec:
      name: ""
      description: "Send a CVE vulnerability payload to ServiceNow"
      spec:
        - question_name: Target host FQDN
          question_description: "FQDN of the affected host — leave blank to auto-detect from the lightspeed-patching inventory"
          variable: target_fqdn
          type: text
          required: false
          default: ""
        - question_name: Pin a specific CVE
          question_description: "Leave blank to use the highest-CVSS known-exploit CVE from Insights"
          variable: pinned_cve
          type: text
          required: false
          default: ""

  # ── CVE Incident (proactive — Insights-triggered) ──────────────────────────
  - name: "{{ jt_snow_create_cve_inc }}"
    job_type: run
    organization: "{{ my_organization }}"
    inventory: "{{ control_inventory_name }}"
    project: "{{ project_name }}"
    playbook: playbooks/servicenow/create_cve_incident.yml
    execution_environment: "{{ my_execution_environment }}"
    credentials:
      - "{{ cred_servicenow }}"
    # Accept the workflow's launch vars + fetch_remediation set_stats artifacts
    # (has_automated_remediation, reported_cve, host_fqdn, cve_*, remediation_*).
    ask_variables_on_launch: true
