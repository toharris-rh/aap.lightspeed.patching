---
# Consumed by infra.aap_configuration.controller_credentials.
# Inputs come from env-var lookups in group_vars/all.yml — no secrets here.
controller_credentials:
  # ── Galaxy / Automation Hub ──────────────────────────────────────────────────
  - name: Automation Hub - certified
    organization: "{{ my_organization }}"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    inputs:
      url: "https://console.redhat.com/api/automation-hub/content/published/"
      auth_url: "{{ hub_auth_url }}"
      token: "{{ hub_token }}"

  - name: Automation Hub - validated
    organization: "{{ my_organization }}"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    inputs:
      url: "https://console.redhat.com/api/automation-hub/content/validated/"
      auth_url: "{{ hub_auth_url }}"
      token: "{{ hub_token }}"

  # ── Project credentials ─────────────────────────────────────────────────────
  - name: "{{ cred_aws }}"
    organization: "{{ my_organization }}"
    credential_type: Amazon Web Services
    inputs:
      username: "{{ aws_access_key_id }}"
      password: "{{ aws_secret_access_key }}"

  - name: "{{ cred_linux }}"
    organization: "{{ my_organization }}"
    credential_type: Machine
    inputs:
      username: "{{ linux_admin_username }}"
      ssh_key_data: "{{ linux_ssh_private_key }}"

  - name: "{{ cred_controller }}"
    organization: "{{ my_organization }}"
    credential_type: Red Hat Ansible Automation Platform
    inputs:
      host: "{{ controller_cred_host }}"
      username: "{{ controller_cred_username }}"
      password: "{{ controller_cred_password }}"

  - name: "{{ cred_servicenow }}"
    organization: "{{ my_organization }}"
    credential_type: ServiceNow ITSM
    inputs:
      instance: "{{ servicenow_instance }}"
      username: "{{ servicenow_username }}"
      password: "{{ servicenow_password }}"

  - name: "{{ cred_rh_cdn }}"
    organization: "{{ my_organization }}"
    credential_type: Red Hat CDN Registration
    inputs:
      rh_org_id: "{{ rh_org_id }}"
      rh_activation_key: "{{ rh_activation_key }}"

  # Red Hat Insights — service account, built-in "Insights" type. Kept for the
  # future Insights PROJECT sync (scm_type: insights, Slice 5). NOTE: kind=insights
  # cannot attach to a job template, so JTs use cred_insights_api below instead.
  # Service account needs Inventory Hosts Viewer + Vulnerability Viewer +
  # Remediations access on console.redhat.com.
  - name: "{{ cred_insights }}"
    organization: "{{ my_organization }}"
    credential_type: Insights
    inputs:
      client_id: "{{ insights_client_id }}"
      client_secret: "{{ insights_client_secret }}"

  # Insights API creds for JOB TEMPLATES (custom kind=cloud type — attachable to
  # JTs, unlike the built-in Insights kind). Injects INSIGHTS_CLIENT_ID/SECRET/
  # BASE_URL for introduce_cve, fetch_remediation, and the correlation JT
  # (issue #101 — the real resolution of #78).
  - name: "{{ cred_insights_api }}"
    organization: "{{ my_organization }}"
    credential_type: "Lightspeed Patching - Insights API"
    inputs:
      client_id: "{{ insights_client_id }}"
      client_secret: "{{ insights_client_secret }}"
      base_url: "{{ insights_base_url }}"

  - name: "{{ cred_hub_registry }}"
    # Container Registry credential — Controller uses it to pull the Lightspeed
    # Patching EE from the internal Private Automation Hub registry
    # (host = ah_hostname) instead of reaching out to quay.io at job-run time.
    # Attached to the EE in controller_execution_environments.yml.
    organization: "{{ my_organization }}"
    credential_type: Container Registry
    inputs:
      host: "{{ hub_registry_host }}"
      username: "{{ hub_registry_username }}"
      password: "{{ hub_registry_password }}"
      verify_ssl: false
