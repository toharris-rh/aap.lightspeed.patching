---
controller_credential_types:
  - name: "Lightspeed Patching - Satellite API"
    description: "Injects SATELLITE_URL, SATELLITE_USERNAME, SATELLITE_PASSWORD, SATELLITE_ORG for Satellite REST API calls (CV version check + LCE promotion)"
    inputs:
      fields:
        - id: satellite_url
          type: string
          label: "Satellite URL (https://...)"
        - id: satellite_username
          type: string
          label: "Username"
        - id: satellite_password
          type: string
          label: "Password"
          secret: true
        - id: satellite_org
          type: string
          label: "Organization"
      required:
        - satellite_url
        - satellite_username
        - satellite_password
        - satellite_org
    injectors:
      env:
        SATELLITE_URL: !unsafe '{{satellite_url}}'
        SATELLITE_USERNAME: !unsafe '{{satellite_username}}'
        SATELLITE_PASSWORD: !unsafe '{{satellite_password}}'
        SATELLITE_ORG: !unsafe '{{satellite_org}}'

  - name: "Lightspeed Patching - Satellite Registration"
    description: "Injects Satellite hostname, org, and activation key for host registration playbooks"
    inputs:
      fields:
        - id: satellite_hostname
          type: string
          label: "Satellite FQDN"
        - id: satellite_org
          type: string
          label: "Organization"
        - id: satellite_activation_key
          type: string
          label: "Activation Key"
          secret: true
      required:
        - satellite_hostname
        - satellite_org
        - satellite_activation_key
    injectors:
      env:
        SATELLITE_HOSTNAME: !unsafe '{{satellite_hostname}}'
        SATELLITE_ORG: !unsafe '{{satellite_org}}'
        SATELLITE_ACTIVATION_KEY: !unsafe '{{satellite_activation_key}}'

  # Red Hat Insights API creds for JOB TEMPLATES. The built-in "Insights"
  # credential is kind=insights, which the controller refuses to attach to a job
  # template ("Cannot assign a Credential of kind insights") — it's only valid on
  # inventories/projects. This custom kind=cloud type injects the same env vars
  # and DOES attach to JTs (issue #101 — the real fix for #78).
  - name: "Lightspeed Patching - Insights API"
    description: "Injects INSIGHTS_CLIENT_ID/SECRET/BASE_URL for Insights API playbooks (attachable to job templates)"
    inputs:
      fields:
        - id: client_id
          type: string
          label: "Service account client ID"
        - id: client_secret
          type: string
          label: "Service account client secret"
          secret: true
        - id: base_url
          type: string
          label: "Insights base URL"
      required:
        - client_id
        - client_secret
    injectors:
      env:
        INSIGHTS_CLIENT_ID: !unsafe '{{client_id}}'
        INSIGHTS_CLIENT_SECRET: !unsafe '{{client_secret}}'
        INSIGHTS_BASE_URL: !unsafe '{{base_url}}'

  - name: "RH Insights Integration"
    description: "Injects RH_INSIGHTS_INTEGRATION_PASSWORD for the rh_insights_integration ServiceNow user"
    inputs:
      fields:
        - id: password
          type: string
          label: "rh_insights_integration password"
          secret: true
      required:
        - password
    injectors:
      env:
        RH_INSIGHTS_INTEGRATION_PASSWORD: !unsafe '{{password}}'

  - name: "ServiceNow ITSM"
    description: "Injects SN_HOST, SN_USERNAME, and SN_PASSWORD for servicenow.itsm modules"
    inputs:
      fields:
        - id: instance
          type: string
          label: "Instance"
        - id: username
          type: string
          label: "Username"
        - id: password
          type: string
          label: "Password"
          secret: true
      required:
        - instance
        - username
        - password
    injectors:
      env:
        SN_HOST: !unsafe '{{instance}}'
        SN_USERNAME: !unsafe '{{username}}'
        SN_PASSWORD: !unsafe '{{password}}'
