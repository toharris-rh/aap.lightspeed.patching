---
# ============================================================================
# rulebooks/servicenow_incident_events.yml
# ============================================================================
# EDA rulebook: listens for ServiceNow INC events from the Harris Business Rule
# and responds with two independent actions:
#
#   Rule 1 — Link CMDB CI (fires on every CVE_INCIDENT insert)
#     Business Rule "Harris - Inc" extracts display_name from the incident
#     description and includes it in the payload. This rule immediately runs
#     the "SNow Relate CMDB CI to Incident" JT so the Affected CI is set
#     on every new CVE incident, regardless of how it was triggered.
#
#   Rule 2 — Remediate CVE (fires when category matches)
#     Launches the remediation workflow on Insights-originated incidents.
#     ⚠️  PENDING: validate the exact category field value.
#
# Flow:
#   ServiceNow INC created (Insights native integration)
#     → Business Rule "Harris - Inc" → POST to EDA event stream
#         → Rule 1: link CI         (event.payload.event == "CVE_INCIDENT")
#         → Rule 2: remediate CVE   (event.payload.category == "software")
# ============================================================================

- name: Listen for ServiceNow incidents from Red Hat Insights
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Link CMDB CI to new CVE incident
      # Fires on every CVE_INCIDENT payload from the Harris Business Rule.
      # display_name is extracted from the incident description by the Business
      # Rule and passed here as event.payload.display_name.
      condition: event.payload.event == "CVE_INCIDENT" and event.payload.number is defined
      action:
        run_job_template:
          name: "Lightspeed Patching - SNow Relate CMDB CI to Incident"
          organization: "{{ my_organization }}"
          job_args:
            extra_vars:
              incident_number: "{{ event.payload.number }}"
              host_fqdn: "{{ event.payload.display_name | default('') }}"

    - name: Remediate CVE on Insights-originated incident
      # TODO (Tony, Phase 5): replace condition with confirmed Insights INC field.
      # Candidate fields from the SNow INC payload:
      #   event.payload.category == "software"
      #   event.payload.u_source == "Red Hat Insights"
      condition: event.payload.category == "software"
      action:
        run_workflow_template:
          name: "Lightspeed Patching - Remediate CVE"
          organization: "{{ my_organization }}"
          job_args:
            extra_vars:
              incident_number: "{{ event.payload.number }}"
              incident_sys_id: "{{ event.payload.sys_id }}"
              advisory_id: "{{ event.payload.short_description | default('') }}"
              affected_hosts: "{{ event.payload.cmdb_ci | default('') }}"
